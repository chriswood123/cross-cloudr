apiVersion: v1
kind: Service
metadata:
  name: {{ include "cross-cloudr.fullname" . }}-frontend
  labels:
    {{- include "cross-cloudr.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cross-cloudr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
