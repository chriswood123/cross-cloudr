apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cross-cloudr.fullname" . }}
  labels:
    {{- include "cross-cloudr.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_USERNAME: {{ .Values.admin.username | quote }}
  ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  ENCRYPTION_KEY: {{ required "A valid .Values.admin.encryptionKey is required" .Values.admin.encryptionKey | quote }}
  SESSION_SECRET: {{ required "A valid .Values.admin.sessionSecret is required" .Values.admin.sessionSecret | quote }}
  DATABASE_URL: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "cross-cloudr.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
